name: render
on:
  push:
  workflow_dispatch:

# One deploy at a time; a newer push cancels an in-flight one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.32
      - name: Render deck
        run: quarto render
      - uses: actions/upload-artifact@v4
        with:
          name: deck
          path: _output/index.html
      # Pages artifact is built on every branch so render failures show up early,
      # but only main deploys (see the deploy job).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _output

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
