project:
  type: default
  render: [index.qmd]        # slides/*.qmd are partials, pulled in by index.qmd
  output-dir: _output

format:
  revealjs:
    theme: [default, theme/paper.scss]
    width: 1600
    height: 900
    margin: 0.07
    center: false
    controls: false
    progress: false
    slide-number: false
    menu: false
    hash: true
    transition: fade
    transition-speed: fast
    auto-animate-duration: 0.9
    embed-resources: true      # one self-contained file: presents offline, fonts included
    include-after-body:
      text: '<script src="js/smil.js"></script>'
