<svg viewBox="0 0 1100 440" xmlns="http://www.w3.org/2000/svg" style="overflow: visible" role="img" aria-label="An open set box, its lid standing up behind with the datom logo inside; four index cards stand in the box: hashes, manifest, version log and parquet">
  <defs>
    <filter id="sb-wob" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="sb-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#8C877D" stroke-width="1.4"/>
    </pattern>
    <!-- the lid's inside: sparser and lighter, so the logo printed on it reads -->
    <pattern id="sb-lid-hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#8C877D" stroke-width="1.3" opacity="0.6"/>
    </pattern>
  </defs>

  <g filter="url(#sb-wob)" fill="none" stroke="#3A3834" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- the lid, hinged on the back rim and standing up behind: its inside faces us, hatched -->
    <path d="M256 220 L916 220 L946 40 L286 40 Z" fill="#F5F1E8" stroke="none"/>
    <path d="M256 220 L916 220 L946 40 L286 40 Z" fill="url(#sb-lid-hatch)" stroke="none"/>
    <path id="sb-lid" d="M256 220 L286 40 L946 40 L916 220"/>
    <use href="#sb-lid" transform="translate(2 2)" opacity="0.4"/>
    <path d="M288 54 L944 54" stroke-width="2.2"/>

    <!-- the datom logo printed on the inside of the lid, sheared to sit on its slope -->
    <g transform="translate(608 89) skewX(-9.46) scale(0.44) translate(-91 -105)" stroke-width="5">
      <!-- a clear paper patch behind the logo -->
      <ellipse cx="91" cy="105" rx="125" ry="100" fill="#F5F1E8" stroke="none"/>
      <polygon points="90.965,3 178.93,54.5 178.93,155.5 90.965,207 3,155.5 3,54.5" fill="#F5F1E8" stroke-width="6.5"/>
      <g transform="translate(91 88)" stroke="#8C877D" stroke-width="3">
        <ellipse rx="56" ry="22"/>
        <ellipse rx="56" ry="22" transform="rotate(60)"/>
        <ellipse rx="56" ry="22" transform="rotate(-60)"/>
        <g fill="#3A3834" stroke="none">
          <circle cx="56" cy="0" r="7"/>
          <circle cx="-28" cy="-48.5" r="7"/>
          <circle cx="-28" cy="48.5" r="7"/>
        </g>
        <rect x="-14" y="-12" width="28" height="24" rx="2" fill="#F5F1E8" stroke="#3A3834" stroke-width="4"/>
        <path d="M-14 -5 L14 -5 M-4.7 -12 L-4.7 12 M4.6 -12 L4.6 12" stroke="#3A3834" stroke-width="2.5"/>
      </g>
      <!-- the wordmark as outlines (DejaVu Sans Mono Bold), so it looks the same on every machine -->
      <path d="M55.7 158.9V150.7H59.7V172H55.7V169.7Q55 171.1 54 171.7Q53 172.4 51.6 172.4Q49 172.4 47.5 170.3Q46.1 168.2 46.1 164.4Q46.1 160.5 47.6 158.4Q49 156.3 51.7 156.3Q53 156.3 54 157Q54.9 157.6 55.7 158.9ZM50.1 164.4Q50.1 166.6 50.8 167.9Q51.6 169.1 52.9 169.1Q54.2 169.1 54.9 167.9Q55.7 166.6 55.7 164.4Q55.7 162.2 54.9 160.9Q54.2 159.7 52.9 159.7Q51.6 159.7 50.8 160.9Q50.1 162.2 50.1 164.4Z M73.3 164.8Q71 164.8 70.2 165.4Q69.3 166 69.3 167.4Q69.3 168.4 69.9 169Q70.5 169.6 71.5 169.6Q73.1 169.6 74 168.4Q74.9 167.2 74.9 165.1V164.8ZM78.9 163.3V172H74.9V170.3Q74.2 171.3 73 171.8Q71.9 172.4 70.5 172.4Q67.9 172.4 66.5 171Q65 169.6 65 167.2Q65 164.5 66.7 163.2Q68.5 161.9 72.1 161.9H74.9V161.3Q74.9 160.3 74.2 159.8Q73.5 159.3 72.1 159.3Q70.7 159.3 69.3 159.6Q68 160 66.5 160.8V157.4Q67.8 156.8 69.2 156.6Q70.6 156.3 72.1 156.3Q75.8 156.3 77.4 157.8Q78.9 159.4 78.9 163.3Z M92 152.3V156.7H97.2V159.8H92V167Q92 168 92.5 168.5Q93 168.9 94.2 168.9H97.2V172H93.9Q90.4 172 89.2 170.9Q88 169.8 88 166.8V159.8H84.1V156.7H88V152.3Z M109.9 159.6Q108.4 159.6 107.6 160.8Q106.8 162.1 106.8 164.4Q106.8 166.6 107.6 167.9Q108.4 169.1 109.9 169.1Q111.3 169.1 112.1 167.9Q112.9 166.6 112.9 164.4Q112.9 162.1 112.1 160.8Q111.3 159.6 109.9 159.6ZM102.8 164.4Q102.8 160.7 104.7 158.5Q106.6 156.3 109.9 156.3Q113.1 156.3 115 158.5Q116.9 160.7 116.9 164.4Q116.9 168.1 115 170.2Q113.1 172.4 109.9 172.4Q106.6 172.4 104.7 170.2Q102.8 168.1 102.8 164.4Z M129.7 158.2Q130.2 157.2 130.9 156.8Q131.6 156.3 132.6 156.3Q134.6 156.3 135.3 157.7Q136.1 159.1 136.1 163.4V172H132.8V162.2Q132.8 160.5 132.5 159.9Q132.3 159.3 131.6 159.3Q130.9 159.3 130.6 159.9Q130.4 160.5 130.4 162.2V172H127.1V162.2Q127.1 160.5 126.8 159.9Q126.6 159.3 125.9 159.3Q125.2 159.3 124.9 159.9Q124.7 160.5 124.7 162.2V172H121.4V156.7H124.3V158.3Q124.7 157.4 125.4 156.8Q126.2 156.3 127.1 156.3Q128 156.3 128.8 156.9Q129.6 157.4 129.7 158.2Z" fill="#3A3834" stroke="none"/>
    </g>

    <!-- the four index cards standing in the box, each with its icon; the labels are HTML -->
    <path d="M239 150 L286 150 L292 138 L341 138 L347 150 L394 150 L394 280 L239 280 Z" fill="#F5F1E8"/>
    <path d="M400 144 L447 144 L453 132 L502 132 L508 144 L555 144 L555 280 L400 280 Z" fill="#F5F1E8"/>
    <path d="M561 152 L608 152 L614 140 L663 140 L669 152 L716 152 L716 280 L561 280 Z" fill="#F5F1E8"/>
    <path d="M722 146 L769 146 L775 134 L824 134 L830 146 L877 146 L877 280 L722 280 Z" fill="#F5F1E8"/>
    <g stroke-width="2.4">
      <!-- hashes: # -->
      <path transform="translate(-7.5 0)" d="M314 168 L306 212 M338 168 L330 212 M298 181 L348 181 M295 199 L345 199"/>
      <!-- manifest: a page with a folded corner and lines -->
      <path transform="translate(-2.5 0)" d="M462 162 L490 162 L502 174 L502 214 L462 214 Z M490 162 L490 174 L502 174 M470 184 L494 184 M470 193 L494 193 M470 202 L488 202"/>
      <!-- version log: a list of entries -->
      <g transform="translate(2.5 0)"><circle cx="616" cy="174" r="3.5"/><circle cx="616" cy="189" r="3.5"/><circle cx="616" cy="204" r="3.5"/>
      <path d="M627 174 L660 174 M627 189 L660 189 M627 204 L652 204"/></g>
      <!-- parquet: a grid table with a header row -->
      <path transform="translate(7.5 0)" d="M767 162 L817 162 L817 212 L767 212 Z M767 175 L817 175 M767 187.5 L817 187.5 M767 200 L817 200 M783.7 162 L783.7 212 M800.3 162 L800.3 212"/>
    </g>


    <!-- the box: front face with a thumb notch (covers the cards' feet), hatched side -->
    <path d="M200 262 L530 262 A28 20 0 0 0 586 262 L860 262 L916 220 L916 370 L860 412 L200 412 Z" fill="#F5F1E8" stroke="none"/>
    <path d="M860 262 L916 220 L916 370 L860 412 Z" fill="url(#sb-hatch)" stroke="none"/>
    <path id="sb-box" d="M200 262 L200 412 L860 412 L916 370 L916 220"/>
    <use href="#sb-box" transform="translate(2 2)" opacity="0.4"/>
    <path d="M239 232.8 L200 262 L530 262 A28 20 0 0 0 586 262 L860 262 L916 220 M860 262 L860 412"/>
    <!-- a bracket on the front gathering the four cards -->
    <path d="M239 296 L239 304 L877 304 L877 296 M558 304 L558 312" stroke-width="2.2"/>
    <!-- a small mark on the box front: three hexes -->
    <path d="M558 351 l11 6.4 l0 12.7 l-11 6.4 l-11 -6.4 l0 -12.7 Z M547 370.1 l11 6.4 l0 12.7 l-11 6.4 l-11 -6.4 l0 -12.7 Z M569 370.1 l11 6.4 l0 12.7 l-11 6.4 l-11 -6.4 l0 -12.7 Z" stroke-width="2.2"/>
  </g>

  <!-- the two calls, in and back out (hand notes = blue pencil) -->
  <g filter="url(#sb-wob)" fill="none" stroke="#2F6690" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 116 C 172 140, 205 180, 230 230 M232.5 214 L230 230 L217.5 220"/>
    <path d="M890 232 C 925 200, 950 160, 985 128 M970 130 L985 128 L982 143"/>
  </g>

</svg>
