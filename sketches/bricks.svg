<svg viewBox="0 0 551.1 472.8" xmlns="http://www.w3.org/2000/svg" style="overflow: visible" role="img" aria-label="Two toy bricks clicking together">
  <defs>
    <filter id="bk-wob" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="bk-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#8C877D" stroke-width="1.4"/>
    </pattern>
      <g id="bk-brick" fill="none" stroke="#3A3834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 -81.6 L235.6 54.4 L235.6 136 L117.8 204 L-117.8 68 L-117.8 -13.6 Z" fill="#F5F1E8" stroke="none"/>
        <path d="M235.6 54.4 L235.6 136 L117.8 204 L117.8 122.4 Z" fill="url(#bk-hatch)" stroke="none"/>
        <path id="bk-brick-out" d="M0 -81.6 L235.6 54.4 L235.6 136 L117.8 204 L-117.8 68 L-117.8 -13.6 Z"/>
        <use href="#bk-brick-out" transform="translate(2 2)" opacity="0.4"/>
        <path d="M-117.8 -13.6 L117.8 122.4 L235.6 54.4 M117.8 122.4 L117.8 204"/>
        <path d="M-25 -61.9 L-25 -47.6 A25 14.4 0 0 0 25 -47.6 L25 -61.9" fill="#F5F1E8"/>
        <ellipse cx="0" cy="-61.9" rx="25" ry="14.4" fill="#F5F1E8"/>
        <path d="M-83.9 -27.9 L-83.9 -13.6 A25 14.4 0 0 0 -33.9 -13.6 L-33.9 -27.9" fill="#F5F1E8"/>
        <ellipse cx="-58.9" cy="-27.9" rx="25" ry="14.4" fill="#F5F1E8"/>
        <path d="M33.9 -27.9 L33.9 -13.6 A25 14.4 0 0 0 83.9 -13.6 L83.9 -27.9" fill="#F5F1E8"/>
        <ellipse cx="58.9" cy="-27.9" rx="25" ry="14.4" fill="#F5F1E8"/>
        <path d="M-25 6.1 L-25 20.4 A25 14.4 0 0 0 25 20.4 L25 6.1" fill="#F5F1E8"/>
        <ellipse cx="0" cy="6.1" rx="25" ry="14.4" fill="#F5F1E8"/>
        <path d="M92.8 6.1 L92.8 20.4 A25 14.4 0 0 0 142.8 20.4 L142.8 6.1" fill="#F5F1E8"/>
        <ellipse cx="117.8" cy="6.1" rx="25" ry="14.4" fill="#F5F1E8"/>
        <path d="M33.9 40.1 L33.9 54.4 A25 14.4 0 0 0 83.9 54.4 L83.9 40.1" fill="#F5F1E8"/>
        <ellipse cx="58.9" cy="40.1" rx="25" ry="14.4" fill="#F5F1E8"/>
        <path d="M151.7 40.1 L151.7 54.4 A25 14.4 0 0 0 201.7 54.4 L201.7 40.1" fill="#F5F1E8"/>
        <ellipse cx="176.7" cy="40.1" rx="25" ry="14.4" fill="#F5F1E8"/>
        <path d="M92.8 74.1 L92.8 88.4 A25 14.4 0 0 0 142.8 88.4 L142.8 74.1" fill="#F5F1E8"/>
        <ellipse cx="117.8" cy="74.1" rx="25" ry="14.4" fill="#F5F1E8"/>
      </g>

  </defs>

  <g transform="translate(157.8 238.8)">
    <!-- the bottom brick, at rest -->
    <use href="#bk-brick" filter="url(#bk-wob)"/>

    <!-- the top brick, lowered onto the studs: slow approach, then the snap -->
    <g transform="translate(0 -100)">
      <animateTransform attributeName="transform" type="translate" values="0 -100; 0 -12; 0 0"
                        begin="0.5s" dur="2.3s" fill="freeze"
                        calcMode="spline" keyTimes="0;0.8;1" keySplines="0.22 0.61 0.36 1; 0.7 0 1 1"/>
      <use href="#bk-brick" transform="translate(117.8 -13.6)" filter="url(#bk-wob)"/>
    </g>

    <!-- the click (motion = orange) -->
    <g fill="none" stroke="#C8692E" stroke-width="2.5" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.4;1" begin="2.8s" dur="1.4s" fill="freeze"/>
      <path d="M-14 54.4 l-16 0 M-11 41.4 l-12 -10 M-11 67.4 l-12 10">
        <animateTransform attributeName="transform" type="translate" values="0 0; -9 0" begin="2.8s" dur="1.4s" fill="freeze"/>
      </path>
      <path d="M131.8 122.4 l16 0 M128.8 109.4 l12 -10 M128.8 135.4 l12 10">
        <animateTransform attributeName="transform" type="translate" values="0 0; 9 0" begin="2.8s" dur="1.4s" fill="freeze"/>
      </path>
    </g>
  </g>
</svg>
