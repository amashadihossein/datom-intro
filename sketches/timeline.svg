<svg class="scene" viewBox="0 0 1500 540" xmlns="http://www.w3.org/2000/svg" style="overflow: visible" role="img" aria-label="A timeline. It starts with a question: why can&#8217;t data collaboration be as smooth as code collaboration? Data as code: daapr from 2020, an R/Pharma talk in 2021, years of use across studies, a posit::conf talk in 2025. In 2025 a second track branches off: datom, a standard for storage, running to R/Pharma 2026, today. From today, rays fan out to what a storage standard can enable: self-describing data, diffs without fetching, managed migration, access from lineage, reads by policy, and your build.">
