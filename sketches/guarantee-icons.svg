<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position: absolute" aria-hidden="true">
  <!-- small icons for the guarantees slide, used as <use href="#gu-..."/> in a 64x64 viewBox -->
  <defs>
    <filter id="gu-wob" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="37" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="gu-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#8C877D" stroke-width="1.3"/>
    </pattern>
    <!-- every version kept: three stacked versions -->
    <symbol id="gu-versions" viewBox="0 0 64 64"><g fill="none" stroke="#3A3834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#gu-wob)">
      <rect x="8" y="28" width="32" height="26" rx="3" fill="#F5F1E8"/><rect x="16" y="19" width="32" height="26" rx="3" fill="#F5F1E8"/>
      <rect x="24" y="10" width="32" height="26" rx="3" fill="#F5F1E8"/><rect x="24" y="10" width="32" height="8" fill="url(#gu-hatch)" stroke="none"/>
      <path d="M24 18 H56" stroke-width="2"/></g></symbol>
    <!-- same values, same hash -->
    <symbol id="gu-hash" viewBox="0 0 64 64"><g fill="none" stroke="#3A3834" stroke-width="3.2" stroke-linecap="round" filter="url(#gu-wob)">
      <path d="M27 10 L21 54 M43 10 L37 54 M12 24 H54 M10 40 H52"/></g></symbol>
    <!-- lineage: two parents, one child -->
    <symbol id="gu-lineage" viewBox="0 0 64 64"><g fill="none" stroke="#3A3834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#gu-wob)">
      <path d="M16 18 C 16 36, 32 32, 32 46 M48 18 C 48 36, 32 32, 32 46"/>
      <circle cx="16" cy="14" r="7" fill="#F5F1E8"/><circle cx="48" cy="14" r="7" fill="#F5F1E8"/><circle cx="32" cy="50" r="8" fill="url(#gu-hatch)"/></g></symbol>
    <!-- a set pins exact versions -->
    <symbol id="gu-pin" viewBox="0 0 64 64"><g fill="none" stroke="#3A3834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#gu-wob)">
      <path d="M32 34 V58"/><circle cx="32" cy="21" r="14" fill="#F5F1E8"/><circle cx="32" cy="21" r="5" fill="#3A3834" stroke="none"/></g></symbol>
    <!-- every write is a commit -->
    <symbol id="gu-commit" viewBox="0 0 64 64"><g fill="none" stroke="#3A3834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#gu-wob)">
      <path d="M4 32 H22 M42 32 H60"/><circle cx="32" cy="32" r="10" fill="#F5F1E8"/>
      <circle cx="49" cy="12" r="5"/><path d="M41 26 C 41 20, 57 20, 57 26"/></g></symbol>
    <!-- readers need storage only -->
    <symbol id="gu-reader" viewBox="0 0 64 64"><g fill="none" stroke="#3A3834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#gu-wob)">
      <path d="M4 32 C 16 14, 48 14, 60 32 C 48 50, 16 50, 4 32 Z" fill="#F5F1E8"/><circle cx="32" cy="32" r="9" fill="url(#gu-hatch)"/><circle cx="32" cy="32" r="3" fill="#3A3834" stroke="none"/></g></symbol>
    <!-- nothing to host: a server, crossed out -->
    <symbol id="gu-noserver" viewBox="0 0 64 64"><g fill="none" stroke="#3A3834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#gu-wob)">
      <rect x="16" y="8" width="32" height="48" rx="4" fill="#F5F1E8"/><path d="M22 20 H42 M22 30 H42 M22 40 H42" stroke-width="2"/>
      <path d="M8 58 L56 6" stroke-width="3.6"/></g></symbol>
    <!-- open format: an open padlock -->
    <symbol id="gu-open" viewBox="0 0 64 64"><g fill="none" stroke="#3A3834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#gu-wob)">
      <path d="M22 30 V18 C 22 6, 42 6, 42 16"/><rect x="12" y="30" width="40" height="28" rx="4" fill="#F5F1E8"/>
      <rect x="12" y="30" width="40" height="28" rx="4" fill="url(#gu-hatch)" stroke="none" opacity="0.6"/><circle cx="32" cy="42" r="3.5" fill="#3A3834" stroke="none"/><path d="M32 45 V51"/></g></symbol>
  </defs>
</svg>
