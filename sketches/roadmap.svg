<svg class="road-cards" viewBox="0 0 1500 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <filter id="rm-wob" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- ships today: ink -->
  <g filter="url(#rm-wob)" fill="none" stroke="#3A3834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect id="rm-ink" x="6" y="6" width="456" height="586" rx="18" fill="#FAF7F0"/>
    <use href="#rm-ink" transform="translate(2 2)" opacity="0.4"/>
    <path d="M30 100 C 160 96, 320 103, 438 98" stroke-width="2"/>
  </g>

  <!-- designed, next: dashed grey pencil -->
  <g class="fragment" data-fragment-index="1">
    <g filter="url(#rm-wob)" fill="none" stroke="#8C877D" stroke-width="2.6" stroke-dasharray="4 9" stroke-linecap="round" stroke-linejoin="round">
      <rect x="522" y="6" width="456" height="586" rx="18"/>
      <path d="M546 100 C 676 96, 836 103, 954 98"/>
    </g>
  </g>

  <!-- open to anyone: blue pencil -->
  <g class="fragment" data-fragment-index="2">
    <g filter="url(#rm-wob)" fill="none" stroke="#2F6690" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1038" y="6" width="456" height="586" rx="18"/>
      <path d="M1062 100 C 1192 96, 1352 103, 1470 98"/>
    </g>
  </g>
</svg>
