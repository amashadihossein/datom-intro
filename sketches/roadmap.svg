<svg class="scene" viewBox="-70 -70 1600 570" xmlns="http://www.w3.org/2000/svg" style="overflow: visible" role="img" aria-label="The git and storage split. Ink labels mark what ships in datom 0.2.0; dashed pencil adds what is designed or next: more projects behind git (datomanager), a fence around storage (access layer), a Python reader, a move to new storage (managed migration), and daapr built on top">
