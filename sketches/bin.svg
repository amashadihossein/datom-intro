<svg viewBox="0 50 1400 470" xmlns="http://www.w3.org/2000/svg" style="overflow: visible" role="img" aria-label="Three set boxes, opened and empty, tipped into one big bin: a half-built castle, a half-built ship with a stray brick stuck on, and a crumpled instruction booklet, lying on a pile of loose bricks">
  <defs>
    <filter id="bn-wob" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="bn-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#8C877D" stroke-width="1.4"/>
    </pattern>

    <!-- the brick from bricks.svg, at half size, stroke kept at the deck's weight -->
    <g id="bn-brick" fill="none" stroke="#3A3834" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -40.8 L117.8 27.2 L117.8 68 L58.9 102 L-58.9 34 L-58.9 -6.8 Z" fill="#F5F1E8" stroke="none"/>
      <path d="M117.8 27.2 L117.8 68 L58.9 102 L58.9 61.2 Z" fill="url(#bn-hatch)" stroke="none"/>
      <path id="bn-brick-out" d="M0 -40.8 L117.8 27.2 L117.8 68 L58.9 102 L-58.9 34 L-58.9 -6.8 Z"/>
      <use href="#bn-brick-out" transform="translate(2 2)" opacity="0.4"/>
      <path d="M-58.9 -6.8 L58.9 61.2 L117.8 27.2 M58.9 61.2 L58.9 102"/>
      <path d="M-12.5 -30.9 L-12.5 -23.8 A12.5 7.2 0 0 0 12.5 -23.8 L12.5 -30.9" fill="#F5F1E8"/>
      <ellipse cx="0" cy="-30.9" rx="12.5" ry="7.2" fill="#F5F1E8"/>
      <path d="M-42 -13.9 L-42 -6.8 A12.5 7.2 0 0 0 -16.9 -6.8 L-16.9 -13.9" fill="#F5F1E8"/>
      <ellipse cx="-29.4" cy="-13.9" rx="12.5" ry="7.2" fill="#F5F1E8"/>
      <path d="M16.9 -13.9 L16.9 -6.8 A12.5 7.2 0 0 0 42 -6.8 L42 -13.9" fill="#F5F1E8"/>
      <ellipse cx="29.4" cy="-13.9" rx="12.5" ry="7.2" fill="#F5F1E8"/>
      <path d="M-12.5 3 L-12.5 10.2 A12.5 7.2 0 0 0 12.5 10.2 L12.5 3" fill="#F5F1E8"/>
      <ellipse cx="0" cy="3" rx="12.5" ry="7.2" fill="#F5F1E8"/>
      <path d="M46.4 3 L46.4 10.2 A12.5 7.2 0 0 0 71.4 10.2 L71.4 3" fill="#F5F1E8"/>
      <ellipse cx="58.9" cy="3" rx="12.5" ry="7.2" fill="#F5F1E8"/>
      <path d="M16.9 20.1 L16.9 27.2 A12.5 7.2 0 0 0 42 27.2 L42 20.1" fill="#F5F1E8"/>
      <ellipse cx="29.4" cy="20.1" rx="12.5" ry="7.2" fill="#F5F1E8"/>
      <path d="M75.8 20.1 L75.8 27.2 A12.5 7.2 0 0 0 100.8 27.2 L100.8 20.1" fill="#F5F1E8"/>
      <ellipse cx="88.3" cy="20.1" rx="12.5" ry="7.2" fill="#F5F1E8"/>
      <path d="M46.4 37 L46.4 44.2 A12.5 7.2 0 0 0 71.4 44.2 L71.4 37" fill="#F5F1E8"/>
      <ellipse cx="58.9" cy="37" rx="12.5" ry="7.2" fill="#F5F1E8"/>
    </g>

    <!-- a set's box, front face 150 wide, opened and empty: flaps up, the inside showing; the picture on the front is drawn per set -->
    <g id="bn-box">
      <path d="M24 176 L40 140 L190 140 L174 176 Z" fill="#F5F1E8"/>
      <path d="M0 200 L-24 186 L0 160 L24 176 Z" fill="#F5F1E8"/>
      <path d="M0 200 L24 176 L174 176 L174 296 L150 320 L0 320 Z" fill="#F5F1E8" stroke="none"/>
      <path d="M150 200 L174 176 L174 296 L150 320 Z" fill="url(#bn-hatch)" stroke="none"/>
      <path id="bn-box-out" d="M0 200 L24 176 L174 176 L174 296 L150 320 L0 320 Z"/>
      <use href="#bn-box-out" transform="translate(2 2)" opacity="0.4"/>
      <path d="M0 200 L24 176 L174 176 L150 200 Z" fill="#EDE7DA" stroke="none"/>
      <path d="M0 200 L150 200 L174 176 M150 200 L150 320"/>
    </g>

  </defs>

  <!-- three boxed sets, opened and emptied (fade out when the bin is zoomed) -->
  <g class="bn-before" filter="url(#bn-wob)" fill="none" stroke="#3A3834" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(30 0)">
      <use href="#bn-box"/>
      <path d="M30 300 L30 234 L37 234 L37 241 L44 241 L44 234 L51 234 L51 300 M51 258 L51 252 L60 252 L60 258 L69 258 L69 252 L81 252 L81 258 L90 258 L90 252 L99 252 L99 300 M99 234 L106 234 L106 241 L113 241 L113 234 L120 234 L120 300 L30 300 M66 300 L66 282 Q75 272 84 282 L84 300" stroke-width="2.2"/>
    </g>
    <g transform="translate(245 0)">
      <use href="#bn-box"/>
      <path d="M28 282 L122 282 L108 302 L42 302 Z M75 282 L75 226 M75 232 L110 274 L75 274 M75 226 L89 231 L75 236" stroke-width="2.2"/>
    </g>
    <g transform="translate(460 0)">
      <use href="#bn-box"/>
      <path d="M38 302 L38 264 L112 264 L112 302 Z M30 268 L75 230 L120 268 M68 302 L68 282 L82 282 L82 302 M48 274 L60 274 L60 286 L48 286 Z" stroke-width="2.2"/>
    </g>
  </g>

  <!-- tipped in -->
  <g class="bn-before" filter="url(#bn-wob)" fill="none" stroke="#3A3834" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M690 262 C 730 200, 790 196, 834 242"/>
    <path d="M818 238 L834 242 L834 225"/>
  </g>

  <!-- one big bin: every brick kept, every set half-built and mixed in -->
  <g filter="url(#bn-wob)" fill="none" stroke="#3A3834" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="1110" cy="170" rx="240" ry="50" fill="url(#bn-hatch)" stroke="none"/>
    <path d="M870 170 A240 50 0 0 1 1350 170"/>
  </g>
  <use href="#bn-brick" transform="translate(1050 116) rotate(8 29 30)" filter="url(#bn-wob)"/>
  <use href="#bn-brick" transform="translate(1185 140) rotate(-14 29 30)" filter="url(#bn-wob)"/>
  <use href="#bn-brick" transform="translate(950 150) rotate(-10 29 30)" filter="url(#bn-wob)"/>
  <use href="#bn-brick" transform="translate(1110 172) rotate(-5 29 30)" filter="url(#bn-wob)"/>
  <use href="#bn-brick" transform="translate(980 186) rotate(17 29 30)" filter="url(#bn-wob)"/>
  <use href="#bn-brick" transform="translate(1190 192) rotate(11 29 30)" filter="url(#bn-wob)"/>
  <!-- what's left of the sets, on top of the pile: a half-built castle, a crumpled booklet, a half-built ship with a stray brick on it -->
  <g filter="url(#bn-wob)" fill="none" stroke="#3A3834" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(965 190) scale(1.35) rotate(-6) translate(-965 -190)">
      <path d="M925 190 L925 82 L933 82 L933 90 L941 90 L941 82 L949 82 L949 90 L957 90 L957 82 L965 82 L965 128 L985 128 L985 138 L1000 138 L1000 150 L1018 150 L1018 190 Z" fill="#F5F1E8"/>
      <path d="M957 90 L965 82 L965 190 L957 190 Z" fill="url(#bn-hatch)" stroke="none"/>
      <path d="M965 128 L965 190 M945 108 L945 124" stroke-width="2.2"/>
      <path d="M969 128 l0 -5 l9 0 l0 5 M988 138 l0 -5 l9 0 l0 5 M1004 150 l0 -5 l9 0 l0 5" stroke-width="2.2"/>
    </g>
    <g transform="translate(1078 176) scale(1.2) rotate(-18) translate(-1078 -176)">
      <path d="M1048 95 L1088 95 L1100 107 L1102 175 L1052 177 Z" fill="#F5F1E8"/>
      <path d="M1088 95 L1088 107 L1100 107 M1057 95 L1059 176" stroke-width="2.2"/>
      <rect x="1066" y="114" width="26" height="16" fill="url(#bn-hatch)" stroke="none"/>
      <rect x="1066" y="114" width="26" height="16" rx="2" stroke-width="2.2"/>
      <path d="M1052 146 L1064 140 L1076 149 L1089 141 L1101 147" stroke-width="2.2"/>
    </g>
    <g transform="translate(1222 176) scale(1.3) rotate(10) translate(-1222 -176)">
      <path d="M1218 140 L1218 104 L1212 96 M1218 104 L1226 99" stroke-width="2.6"/>
      <path d="M1160 140 L1280 140 L1262 175 L1176 175 Z" fill="#F5F1E8"/>
      <path d="M1268 140 L1280 140 L1262 175 L1252 175 Z" fill="url(#bn-hatch)" stroke="none"/>
      <path d="M1236 140 L1236 126 L1262 126 L1262 140 Z" fill="#F5F1E8" stroke-width="2.4"/>
      <path d="M1240 126 l0 -5 l7 0 l0 5 M1251 126 l0 -5 l7 0 l0 5" stroke-width="2.4"/>
    </g>
  </g>
  <g filter="url(#bn-wob)" fill="none" stroke="#3A3834" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M870 170 A240 50 0 0 0 1350 170 L1305 455 A195 40 0 0 1 915 455 Z" fill="#F5F1E8" stroke="none"/>
    <path d="M1270 207 L1350 170 L1305 455 A195 40 0 0 1 1245 484 Z" fill="url(#bn-hatch)" stroke="none"/>
    <path id="bn-bin-out" d="M870 170 A240 50 0 0 0 1350 170 L1305 455 A195 40 0 0 1 915 455 Z"/>
    <use href="#bn-bin-out" transform="translate(2 2)" opacity="0.4"/>
    <path d="M877 186 A236 46 0 0 0 1343 186" stroke-width="2.2"/>
  </g>
</svg>
