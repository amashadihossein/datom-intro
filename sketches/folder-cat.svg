<svg viewBox="0 40 400 240" xmlns="http://www.w3.org/2000/svg" style="overflow: visible" role="img" aria-label="A cat peeking suspiciously over the edge of a folder, its tail curling up out of the side">
  <defs>
    <filter id="fc-wob" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="fc-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#8C877D" stroke-width="1.4"/>
    </pattern>
  </defs>

  <!-- drawn in paper on the dark slide; fills are the night background, so parts hide what is behind them -->
  <g filter="url(#fc-wob)" fill="none" stroke="#F5F1E8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- the back of the folder, with its tab; the inside is shaded -->
    <path d="M60 270 L60 98 Q60 88 70 88 L135 88 L150 102 L330 102 Q340 102 340 112 L340 270 Z" fill="#2B2A27" stroke="none"/>
    <path d="M60 270 L60 102 L340 102 L340 270 Z" fill="url(#fc-hatch)" stroke="none"/>
    <path id="fc-back" d="M60 270 L60 98 Q60 88 70 88 L135 88 L150 102 L330 102 Q340 102 340 112 L340 270 Z"/>
    <use href="#fc-back" transform="translate(2 2)" opacity="0.4"/>

    <!-- the tail, curling up out of the folder's right side; drawn as a paper outline round a night core -->
    <path d="M316 152 C 326 124 350 112 360 94 C 367 81 361 69 351 72" stroke-width="16"/>
    <path d="M316 152 C 326 124 350 112 360 94 C 367 81 361 69 351 72" stroke="#2B2A27" stroke-width="10"/>

    <!-- the cat, sunk low between the two halves of the folder: ears flattened sideways, eyes narrowed -->
    <path d="M150 152 C 147 134 152 122 162 116 L 140 97 L 184 107 Q 200 103 216 107 L 260 97 L 238 116 C 248 122 253 134 250 152" fill="#2B2A27"/>
    <path d="M150 103 L165 113 M250 103 L235 113" stroke-width="2"/>
    <g transform="translate(200 134) scale(1.2) translate(-200 -134)">
      <path d="M168 123 L188 128 M212 128 L232 123" stroke-width="2.4"/>
      <path d="M166 131 L190 135 Q179 145 166 131 Z M210 135 L234 131 Q221 145 210 135 Z" fill="#F5F1E8" stroke-width="2.4"/>
      <ellipse cx="184" cy="137" rx="2" ry="3.2" fill="#2B2A27" stroke="none"/>
      <ellipse cx="228" cy="136.5" rx="2" ry="3.2" fill="#2B2A27" stroke="none"/>
    </g>
    <!-- the front of the folder, tipped open toward us -->
    <path d="M46 146 L354 146 L340 270 L60 270 Z" fill="#2B2A27" stroke="none"/>
    <path id="fc-front" d="M46 146 L354 146 L340 270 L60 270 Z"/>
    <use href="#fc-front" transform="translate(2 2)" opacity="0.4"/>
  </g>
</svg>
