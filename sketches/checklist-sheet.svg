<svg class="cl-sheet" viewBox="0 0 1000 2300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <filter id="cl-wob" x="-2%" y="-1%" width="104%" height="102%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="cl-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#8C877D" stroke-width="1.4"/>
    </pattern>
  </defs>

  <!-- one long sheet, its top-right corner folded over; it runs on past the slide -->
  <path d="M14 10 L926 13 L988 74 L991 2300 L9 2300 Z" fill="#FAF7F0"/>
  <g filter="url(#cl-wob)" fill="none" stroke="#3A3834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path id="cl-edge" d="M9 2300 L14 10 L926 13 L988 74 L991 2300"/>
    <use href="#cl-edge" transform="translate(2 2)" opacity="0.4"/>
    <path d="M926 13 L931 70 L988 74 Z" fill="url(#cl-hatch)"/>
    <!-- a ruled line under the heading -->
    <path d="M66 136 C 300 131, 620 139, 900 133" stroke-width="2"/>
  </g>
</svg>
